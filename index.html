<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鳥獣被害対策システム - リアルタイム共有版</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background-color: #f4f5f7; overflow: hidden; }
        
        header { background-color: #2c3e50; color: white; padding: 10px 20px; font-size: 1.1rem; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.2); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
        .auth-status { font-size: 0.85rem; display: flex; align-items: center; gap: 10px; }
        .auth-btn { background: #34495e; color: white; border: 1px solid #7f8c8d; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .auth-btn:hover { background: #455a64; }

        .form-panel { background-color: #fff; padding: 10px 20px; border-bottom: 2px solid #e0e0e0; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; flex-shrink: 0; }
        .form-group { display: flex; flex-direction: column; gap: 3px; }
        .form-group label { font-size: 0.75rem; font-weight: bold; color: #555; }
        .form-group input, .form-group select { padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.85rem; }
        .form-btn { background-color: #2ecc71; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; height: 32px; transition: background-color 0.2s; }
        .form-btn:hover { background-color: #27ae60; }
        .cancel-btn { background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; height: 32px; }
        
        /* PCレイアウト（左右分割） */
        .main-container { display: flex; flex: 1; height: 100%; min-height: 0; width: 100%; overflow: hidden; position: relative; }
        .side-panel { width: 340px; background: white; box-shadow: 2px 0 5px rgba(0,0,0,0.1); display: flex; flex-direction: column; z-index: 1000; flex-shrink: 0; height: 100%; overflow: hidden; }
        .panel-section { padding: 10px 15px; border-bottom: 1px solid #e0e0e0; flex-shrink: 0; }
        .panel-section h3 { margin-bottom: 6px; color: #34495e; font-size: 0.85rem; border-left: 4px solid #e74c3c; padding-left: 8px; }
        .chart-container { position: relative; height: 110px; width: 100%; }
        
        .data-list-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 10px 15px; }
        .data-list-section h3 { margin-bottom: 6px; color: #34495e; font-size: 0.85rem; border-left: 4px solid #e74c3c; padding-left: 8px; flex-shrink: 0; }
        .data-list { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        
        .data-item { padding: 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.2s; position: relative; }
        .data-item:hover { background-color: #fcf8e3; }
        .badge { display: inline-block; padding: 2px 6px; font-size: 0.7rem; font-weight: bold; color: white; border-radius: 3px; margin-bottom: 4px; }
        .badge-boar { background-color: #8B5A2B; }
        .badge-deer { background-color: #9b59b6; }
        .badge-monkey { background-color: #f1c40f; color: #333; }
        .badge-rabbit { background-color: #3498db; }
        .badge-trap-box { background-color: #e74c3c; }
        .badge-trap-foot { background-color: #2980b9; }
        .badge-trap-enclosure { background-color: #27ae60; }
        .item-title { font-weight: bold; color: #333; font-size: 0.85rem; margin-bottom: 2px; padding-right: 75px; }
        .item-location { font-size: 0.75rem; color: #2c3e50; margin-bottom: 2px; }
        .item-date { font-size: 0.75rem; color: #7f8c8d; }
        .item-action-btns { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
        .action-btn { padding: 2px 5px; font-size: 0.7rem; border: none; border-radius: 3px; cursor: pointer; color: white; font-weight: bold; }
        .btn-edit { background-color: #3498db; }
        .btn-delete { background-color: #e74c3c; }

        #map { flex: 1; height: 100%; width: 100%; min-height: 100%; z-index: 1; position: relative; }
        
        .custom-pin { display: flex; align-items: center; justify-content: center; width: 34px !important; height: 34px !important; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: -2px 2px 6px rgba(0,0,0,0.4); border: 2px solid #ffffff; }
        .custom-pin span { transform: rotate(45deg); font-size: 16px; display: block; margin-bottom: 2px; margin-right: 2px; }
        .pin-boar { background-color: #8B5A2B !important; }
        .pin-deer { background-color: #9b59b6 !important; }
        .pin-monkey { background-color: #f1c40f !important; }
        .pin-rabbit { background-color: #3498db !important; }
        .pin-trap-box { background-color: #e74c3c !important; }
        .pin-trap-foot { background-color: #2980b9 !important; }
        .pin-trap-enclosure { background-color: #27ae60 !important; }

        /* スマホ対応修正 */
        @media (max-width: 768px) {
            html, body { height: auto; overflow-y: auto; overflow-x: hidden; }
            header { font-size: 0.95rem; padding: 8px 12px; }
            .form-panel { padding: 10px; gap: 8px; }
            .form-group { width: 100%; }
            .form-group input, .form-group select { width: 100% !important; }
            .form-btn, .cancel-btn { width: 100%; margin-top: 4px; }

            .main-container { display: block; height: auto; min-height: auto; overflow: visible; }
            .side-panel { width: 100%; height: auto; box-shadow: none; border-bottom: 2px solid #ccc; overflow: visible; }
            .data-list-section { height: 260px; }
            
            #map { 
                display: block !important;
                width: 100% !important; 
                height: 420px !important; 
                min-height: 420px !important; 
                position: relative !important;
                z-index: 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <span>🐗 人吉エリア 鳥獣被害・目撃・罠設置情報</span>
        <div class="auth-status">
            <span id="authLabel" style="color: #2ecc71;">🔓 入力・編集モード</span>
            <button id="loginToggleBtn" class="auth-btn">ログアウト</button>
        </div>
    </header>

    <form id="inputForm" class="form-panel">
        <input type="hidden" id="editId" value="">
        <div class="form-group">
            <label for="formType">区分・獣種</label>
            <select id="formType" required>
                <optgroup label="鳥獣目撃・被害">
                    <option value="boar">イノシシ</option>
                    <option value="deer">ニホンジカ</option>
                    <option value="monkey">サル</option>
                    <option value="rabbit">ノウサギ</option>
                </optgroup>
                <optgroup label="対策">
                    <option value="trap">🪤 罠設置</option>
                </optgroup>
            </select>
        </div>
        <div class="form-group" id="trapTypeGroup">
            <label for="formTrapType">罠の種類</label>
            <select id="formTrapType" disabled>
                <option value="">-- 対象外 --</option>
                <option value="box">箱罠</option>
                <option value="foot">くくり罠</option>
                <option value="enclosure">囲い罠</option>
            </select>
        </div>
        <div class="form-group">
            <label for="formTitle">件名・タイトル</label>
            <input type="text" id="formTitle" placeholder="例：足跡を発見" required style="width: 140px;">
        </div>
        <div class="form-group">
            <label for="formDate">発生・設置日</label>
            <input type="date" id="formDate" required>
        </div>
        <div class="form-group">
            <label for="formLocation">場所（地図クリック可）</label>
            <input type="text" id="formLocation" placeholder="例：下原田町 または 座標" required style="width: 180px;">
        </div>
        <div class="form-group">
            <label for="formDesc">詳細内容</label>
            <input type="text" id="formDesc" placeholder="状況など" style="width: 140px;">
        </div>
        <button type="submit" id="submitBtn" class="form-btn">＋ データを追加</button>
        <button type="button" id="cancelBtn" class="cancel-btn" style="display: none;">キャンセル</button>
    </form>

    <div class="main-container">
        <div class="side-panel">
            <div class="panel-section">
                <h3>獣種別 目撃統計</h3>
                <div class="chart-container"><canvas id="animalChart"></canvas></div>
            </div>
            <div class="panel-section">
                <h3>設置中の罠 種類別内訳</h3>
                <div class="chart-container"><canvas id="trapTypeChart"></canvas></div>
            </div>
            <div class="data-list-section">
                <h3>最近の報告・対策一覧</h3>
                <ul class="data-list" id="infoList"></ul>
            </div>
        </div>
        <div id="map"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const ADMIN_PASSWORD = "球磨工";
        let isLoggedIn = true;

        const firebaseConfig = {
            apiKey: "AIzaSyDu4TDPxTGRVqKchMEW61a1itzsmCDz3Fc",
            authDomain: "hitoyoshi-map-no1.firebaseapp.com",
            databaseURL: "https://hitoyoshi-map-no1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "hitoyoshi-map-no1",
            storageBucket: "hitoyoshi-map-no1.firebasestorage.app",
            messagingSenderId: "706781264395",
            appId: "1:706781264395:web:ddb598c62c6a85f880a50e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'damages');

        const markers = {};
        let animalChart = null;
        let trapTypeChart = null;
        let currentData = {};

        const loginBtn = document.getElementById('loginToggleBtn');
        const authLabel = document.getElementById('authLabel');
        const inputForm = document.getElementById('inputForm');

        const map = L.map('map', {
            center: [32.211, 130.752],
            zoom: 12,
            minZoom: 8,
            layers: [L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            })]
        });

        function resizeMap() {
            setTimeout(() => { 
                map.invalidateSize(); 
            }, 300);
        }
        window.addEventListener('resize', resizeMap);
        window.addEventListener('load', resizeMap);
        document.addEventListener('DOMContentLoaded', resizeMap);

        function updateAuthUI() {
            if (isLoggedIn) {
                authLabel.innerText = '🔓 入力・編集モード';
                authLabel.style.color = '#2ecc71';
                loginBtn.innerText = 'ログアウト';
                inputForm.style.display = 'flex';
            } else {
                authLabel.innerText = '🔒 閲覧モード';
                authLabel.style.color = '#bdc3c7';
                loginBtn.innerText = '関係者ログイン';
                inputForm.style.display = 'none';
                resetForm();
            }
            renderList();
            resizeMap();
        }

        loginBtn.addEventListener('click', () => {
            if (!isLoggedIn) {
                const inputPwd = prompt('関係者用の合言葉（暗証番号）を入力してください:');
                if (inputPwd === ADMIN_PASSWORD) {
                    isLoggedIn = true;
                    updateAuthUI();
                } else if (inputPwd !== null) {
                    alert('合言葉が違います。');
                }
            } else {
                isLoggedIn = false;
                updateAuthUI();
            }
        });

        document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
        const formTypeSelect = document.getElementById('formType');
        formTypeSelect.addEventListener('change', toggleTrapTypeSelect);

        function toggleTrapTypeSelect() {
            const type = formTypeSelect.value;
            const trapTypeSelect = document.getElementById('formTrapType');
            if (type === 'trap') {
                trapTypeSelect.disabled = false;
                trapTypeSelect.required = true;
                trapTypeSelect.value = 'box'; 
            } else {
                trapTypeSelect.disabled = true;
                trapTypeSelect.required = false;
                trapTypeSelect.value = '';
            }
        }

        const clickPopup = L.popup();
        map.on('click', function(e) {
            if (!isLoggedIn) return;
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);
            const div = document.createElement('div');
            div.style.textAlign = "center";
            div.innerHTML = `<strong>選択座標: ${lat}, ${lng}</strong><br><button id="popupCopyBtn" style="margin-top:6px; padding:3px 8px; font-size:11px; cursor:pointer;">フォームに適用</button>`;
            
            div.querySelector('#popupCopyBtn').addEventListener('click', () => {
                document.getElementById('formLocation').value = `${lat}, ${lng}`;
                map.closePopup(clickPopup);
            });
            clickPopup.setLatLng(e.latlng).setContent(div).openOn(map);
        });

        function initCharts() {
            const ctxAnimal = document.getElementById('animalChart').getContext('2d');
            const ctxTrap = document.getElementById('trapTypeChart').getContext('2d');

            if (animalChart) animalChart.destroy();
            if (trapTypeChart) trapTypeChart.destroy();

            animalChart = new Chart(ctxAnimal, {
                type: 'doughnut',
                data: { labels: ['イノシシ', 'ニホンジカ', 'サル', 'ノウサギ'], datasets: [{ data: [0, 0, 0, 0], backgroundColor: ['#8B5A2B', '#9b59b6', '#f1c40f', '#3498db'], borderWidth: 1 }] },
                options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 10 } } } } }
            });

            trapTypeChart = new Chart(ctxTrap, {
                type: 'doughnut',
                data: { labels: ['箱罠', 'くくり罠', '囲い罠'], datasets: [{ data: [0, 0, 0], backgroundColor: ['#e74c3c', '#2980b9', '#27ae60'], borderWidth: 1 }] },
                options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'right', labels: { boxWidth: 10, font: { size: 10 } } } } }
            });
        }

        initCharts();

        onValue(dbRef, (snapshot) => {
            currentData = snapshot.val() || {};
            renderList();
        });

        function renderList() {
            const listContainer = document.getElementById('infoList');
            const fragment = document.createDocumentFragment();
            listContainer.innerHTML = '';

            Object.keys(markers).forEach(id => {
                map.removeLayer(markers[id]);
                delete markers[id];
            });

            const counts = { boar: 0, deer: 0, monkey: 0, rabbit: 0, box: 0, foot: 0, enclosure: 0 };
            const itemsArray = Object.keys(currentData).map(key => ({ id: key, ...currentData[key] }));
            itemsArray.sort((a, b) => new Date(b.date) - new Date(a.date));

            itemsArray.forEach(d => {
                if (counts[d.type] !== undefined) counts[d.type]++;
                if (d.type === 'trap' && counts[d.trapType] !== undefined) counts[d.trapType]++;
            });

            if (animalChart && trapTypeChart) {
                animalChart.data.datasets[0].data = [counts.boar, counts.deer, counts.monkey, counts.rabbit];
                animalChart.update('none');
                trapTypeChart.data.datasets[0].data = [counts.box, counts.foot, counts.enclosure];
                trapTypeChart.update('none');
            }

            itemsArray.forEach(item => {
                let pinClass = 'pin-boar'; let emoji = '🐗'; let badgeClass = 'badge-boar'; let displayTypeName = item.typeName;
                if (item.type === 'deer') { pinClass = 'pin-deer'; emoji = '🦌'; badgeClass = 'badge-deer'; }
                else if (item.type === 'monkey') { pinClass = 'pin-monkey'; emoji = '🐒'; badgeClass = 'badge-monkey'; }
                else if (item.type === 'rabbit') { pinClass = 'pin-rabbit'; emoji = '🐇'; badgeClass = 'badge-rabbit'; }
                else if (item.type === 'trap') { 
                    emoji = '🪤'; let trapLabel = '不明な罠';
                    if (item.trapType === 'box') { pinClass = 'pin-trap-box'; badgeClass = 'badge-trap-box'; trapLabel = '箱罠'; }
                    else if (item.trapType === 'foot') { pinClass = 'pin-trap-foot'; badgeClass = 'badge-trap-foot'; trapLabel = 'くくり罠'; }
                    else if (item.trapType === 'enclosure') { pinClass = 'pin-trap-enclosure'; badgeClass = 'badge-trap-enclosure'; trapLabel = '囲い罠'; }
                    displayTypeName = `罠 (${trapLabel})`;
                }

                if (item.lat && item.lng) {
                    const customIcon = L.divIcon({ className: `custom-pin ${pinClass}`, html: `<span>${emoji}</span>`, iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -34] });
                    const marker = L.marker([item.lat, item.lng], { icon: customIcon }).addTo(map);
                    marker.bindPopup(`<strong>【${displayTypeName}】${item.title}</strong><br><small>場所: ${item.location}</small><br><small>日付: ${item.date}</small><br><br>${item.desc}`);
                    markers[item.id] = marker;
                }

                const listItem = document.createElement('li');
                listItem.className = 'data-item';
                
                const actionBtnsHtml = isLoggedIn 
                    ? `<div class="item-action-btns"><button class="action-btn btn-edit">編集</button><button class="action-btn btn-delete">削除</button></div>` 
                    : '';

                listItem.innerHTML = `<span class="badge ${badgeClass}">${displayTypeName}</span><div class="item-title">${item.title}</div><div class="item-location">📍 ${item.location}</div><div class="item-date">${item.date}</div>${actionBtnsHtml}`;

                listItem.addEventListener('click', (e) => { 
                    if (e.target.tagName !== 'BUTTON' && item.lat && item.lng) { 
                        if (window.innerWidth <= 768) {
                            document.getElementById('map').scrollIntoView({ behavior: 'smooth' });
                        }
                        map.flyTo([item.lat, item.lng], 14); 
                        if (markers[item.id]) markers[item.id].openPopup(); 
                    } 
                });

                if (isLoggedIn) {
                    listItem.querySelector('.btn-edit').addEventListener('click', (e) => { e.stopPropagation(); startEdit(item.id); });
                    listItem.querySelector('.btn-delete').addEventListener('click', (e) => { e.stopPropagation(); deleteData(item.id); });
                }
                
                fragment.appendChild(listItem);
            });

            listContainer.appendChild(fragment);
            resizeMap();
        }

        window.deleteData = function(id) {
            if (!isLoggedIn) return;
            if (confirm('このデータを削除してもよろしいですか？')) {
                remove(ref(db, `damages/${id}`));
                if (document.getElementById('editId').value === id) resetForm();
            }
        }

        window.startEdit = function(id) {
            if (!isLoggedIn) return;
            const item = currentData[id];
            if (!item) return;
            document.getElementById('editId').value = id;
            document.getElementById('formType').value = item.type;
            toggleTrapTypeSelect();
            if (item.type === 'trap') document.getElementById('formTrapType').value = item.trapType;
            document.getElementById('formTitle').value = item.title;
            document.getElementById('formDate').value = item.date;
            document.getElementById('formLocation').value = item.location;
            document.getElementById('formDesc').value = item.desc;
            document.getElementById('submitBtn').innerText = '💾 変更を保存';
            document.getElementById('submitBtn').style.backgroundColor = '#3498db';
            document.getElementById('cancelBtn').style.display = 'inline-block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.getElementById('cancelBtn').addEventListener('click', resetForm);
        function resetForm() {
            document.getElementById('editId').value = ''; 
            document.getElementById('formType').value = 'boar'; 
            toggleTrapTypeSelect();
            document.getElementById('formTitle').value = ''; 
            document.getElementById('formLocation').value = ''; 
            document.getElementById('formDesc').value = '';
            document.getElementById('formDate').value = new Date().toISOString().split('T')[0];
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = '＋ データを追加'; 
            submitBtn.style.backgroundColor = '#2ecc71';
            submitBtn.disabled = false;
            document.getElementById('cancelBtn').style.display = 'none';
        }

        async function fetchCoordinates(locationStr) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);

            try {
                const queryStr = locationStr.includes('熊本県') ? locationStr : '熊本県 ' + locationStr;
                const searchUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(queryStr)}&limit=1`;
                
                // Nominatimの規約に従い、適切なヘッダーを指定
                const response = await fetch(searchUrl, { 
                    headers: { 
                        'Accept-Language': 'ja'
                    },
                    signal: controller.signal 
                });
                clearTimeout(timeoutId);

                if (!response.ok) return null;
                const results = await response.json();
                if (results && results.length > 0) {
                    return { lat: parseFloat(results[0].lat), lng: parseFloat(results[0].lon) };
                }
                return null;
            } catch (err) {
                clearTimeout(timeoutId);
                return null;
            }
        }

        document.getElementById('inputForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!isLoggedIn) return;

            const submitBtn = document.getElementById('submitBtn');
            const locationInput = document.getElementById('formLocation').value.trim();
            const editId = document.getElementById('editId').value;

            const originalBtnText = submitBtn.innerText;
            submitBtn.disabled = true;
            submitBtn.innerText = '🔍 位置を取得中...';

            let lat = null;
            let lng = null;
            const latLngPattern = /^[-+]?([1-8]?\d(\.\d+)?|90(\.0+)?)\s*,\s*[-+]?(180(\.0+)?|((1[0-7]\d)|([1-9]?\d))(\.\d+)?)$/;

            if (latLngPattern.test(locationInput)) {
                const parts = locationInput.split(',');
                lat = parseFloat(parts[0]); 
                lng = parseFloat(parts[1]);
            } else {
                const coords = await fetchCoordinates(locationInput);
                if (coords) {
                    lat = coords.lat;
                    lng = coords.lng;
                } else {
                    alert('熊本県内で該当する場所が見つかりませんでした。\n「人吉市○○町」と入力するか、地図をクリックして座標を割り当ててください。');
                    submitBtn.disabled = false;
                    submitBtn.innerText = originalBtnText;
                    return;
                }
            }

            const type = document.getElementById('formType').value;
            const trapType = document.getElementById('formTrapType').value;
            let typeName = 'イノシシ';
            if (type === 'deer') typeName = 'ニホンジカ';
            if (type === 'monkey') typeName = 'サル';
            if (type === 'rabbit') typeName = 'ノウサギ';
            if (type === 'trap') typeName = '罠設置';

            const newData = {
                type, typeName, trapType,
                title: document.getElementById('formTitle').value,
                date: document.getElementById('formDate').value,
                location: locationInput, lat, lng,
                desc: document.getElementById('formDesc').value || '詳細なし'
            };

            submitBtn.innerText = '💾 保存中...';

            try {
                if (editId) {
                    await update(ref(db, `damages/${editId}`), newData);
                } else {
                    await set(push(dbRef), newData);
                }
                resetForm();
            } catch (err) {
                console.error(err);
                alert('データの保存に失敗しました。');
                submitBtn.disabled = false;
                submitBtn.innerText = originalBtnText;
            }
        });

        setTimeout(() => {
            resizeMap();
        }, 500);
    </script>
</body>
</html>
